[project]
name = "tinyts-scientist"
version = "0.1.0"
description = "An agentic time-series forecasting and anomaly detection system with multi-layered explainability"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    # LangChain ecosystem
    "langchain>=0.3.0,<2.0",
    "langchain-core>=0.3.0,<2.0",
    "langchain-community>=0.3.0,<1.0",
    "langchain-openai>=0.3.0,<2.0",
    "langchain-ollama>=0.2.0,<2.0",

    # Data & scientific computing
    "numpy>=1.24.0,<3.0",
    "pandas>=2.0.0,<3.0",
    "scipy>=1.11.0,<2.0",

    # Time series & statistics
    "statsmodels>=0.14.0,<1.0",
    "pmdarima>=2.0.0,<3.0",

    # Machine learning
    "scikit-learn>=1.3.0,<2.0",
    "lightgbm>=4.0.0,<5.0",

    # Explainability
    "shap>=0.45.0,<1.0",

    # Neural models
    "torch>=2.0.0",

    # Visualization
    "plotly>=5.14.0,<7.0",

    # Web UI
    "streamlit>=1.30.0,<2.0",

    # Data models & configuration
    "pydantic>=2.0.0,<3.0",
    "pydantic-settings>=2.0.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",

    # CLI
    "rich>=13.0.0,<15.0",
    "typer>=0.9.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
tinyts = "tinyts.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["tinyts*"]

[tool.ruff]
line-length = 100
target-version = "py310"
