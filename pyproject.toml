[tool.poetry]
name = "tinyts-scientist"
version = "0.1.0"
description = "A Local, Human-in-the-Loop Agentic Time-Series System"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "tinyts"}]

[tool.poetry.dependencies]
python = "^3.10"
# LangChain ecosystem
langchain = "^0.3.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.0"
langchain-ollama = "^0.2.0"

# Time series libraries
pandas = "^2.0.0"
numpy = "^1.24.0"
statsmodels = "^0.14.0"
scikit-learn = "^1.3.0"
lightgbm = "^4.0.0"

# Neural models
torch = "^2.0.0"
tsfm-public = "^0.2.0"  # IBM Tiny Time Mixers

# Visualization
matplotlib = "^3.7.0"
seaborn = "^0.12.0"
plotly = "^5.14.0"

# Data handling
pyarrow = "^12.0.0"
fastparquet = "^2023.4.0"

# Utilities
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
python-dotenv = "^1.0.0"
rich = "^13.0.0"
typer = "^0.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.285"
mypy = "^1.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

